apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: agency-v1
  labels:
    app: crm-service
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crm-service
  template:
    metadata:
      labels:
        app: crm-service
        version: v2.0.0
    spec:
      serviceAccountName: crm-service-sa
      containers:
        - name: crm-service
          image: legacymark/crm-service:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
              name: http
            - containerPort: 50052
              name: grpc
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4002"
            - name: GRPC_PORT
              value: "50052"
            - name: REDIS_URL
              value: "redis://redis-service.agency-v1:6379"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: agency-v1
  labels:
    app: crm-service
spec:
  type: ClusterIP
  ports:
    - port: 4002
      targetPort: 4002
      name: http
    - port: 50052
      targetPort: 50052
      name: grpc
  selector:
    app: crm-service
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: crm-service-dr
  namespace: agency-v1
spec:
  host: crm-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: primary
      labels:
        version: v2.0.0
    - name: canary
      labels:
        version: v2.1.0
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: crm-service-vs
  namespace: agency-v1
spec:
  hosts:
    - crm-service
  http:
    - route:
        - destination:
            host: crm-service
            subset: primary
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 5s
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: crm-service
  namespace: agency-v1
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crm-service
  service:
    port: 4002
    targetPort: 4002
  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99.5
        interval: 1m
      - name: request-duration
        thresholdRange:
          max: 200
        interval: 1m
