apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: agency-v1
  labels:
    app: notification-service
    version: v1.2.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1.2.0
    spec:
      serviceAccountName: notification-service-sa
      containers:
        - name: notification-service
          image: legacymark/notification-service:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4016
              name: http
            - containerPort: 50055
              name: grpc
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4016"
            - name: GRPC_PORT
              value: "50055"
            - name: REDIS_URL
              value: "redis://redis-service.agency-v1:6379"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 4016
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4016
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: agency-v1
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 4016
      targetPort: 4016
      name: http
    - port: 50055
      targetPort: 50055
      name: grpc
  selector:
    app: notification-service
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: notification-service-dr
  namespace: agency-v1
spec:
  host: notification-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: notification-service-vs
  namespace: agency-v1
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 5s
