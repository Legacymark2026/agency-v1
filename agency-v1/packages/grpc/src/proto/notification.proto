syntax = "proto3";

package notification;

service NotificationService {
  rpc SendDirectNotification (SendNotificationRequest) returns (NotificationResponse);
  rpc CheckHealth (HealthRequest) returns (HealthResponse);
}

message SendNotificationRequest {
  string userId = 1;
  string title = 2;
  string message = 3;
  string type = 4;
}

message NotificationResponse {
  bool success = 1;
  string notificationId = 2;
  string error = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  int64 timestamp = 3;
}
