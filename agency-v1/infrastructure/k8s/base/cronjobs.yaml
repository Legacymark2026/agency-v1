# ── CronJobs (migrated from vercel.json crons) ───────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: automation-rules
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cron-automation
              image: curlimages/curl:latest
              command: ["curl", "-X", "POST", "http://automation-service:4003/api/cron/run-automation"]
          restartPolicy: OnFailure
---
