apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: legacymark

resources:
  - namespace.yaml
  # API Gateway
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - api-gateway/hpa.yaml
  # Auth Service
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - auth-service/hpa.yaml
  # CRM Service
  - crm-service/deployment.yaml
  - crm-service/service.yaml
  - crm-service/hpa.yaml
  # Automation Service
  - automation-service/deployment.yaml
  - automation-service/service.yaml
  - automation-service/hpa.yaml
  # AI Engine
  - ai-engine/deployment.yaml
  - ai-engine/service.yaml
  - ai-engine/hpa.yaml
  # Inbox Service
  - inbox-service/deployment.yaml
  - inbox-service/service.yaml
  - inbox-service/hpa.yaml
  # Finance Service
  - finance-service/deployment.yaml
  - finance-service/service.yaml
  - finance-service/hpa.yaml
  # CronJobs
  - cronjobs.yaml

commonLabels:
  app.kubernetes.io/part-of: legacymark
  managed-by: kustomize

labels:
  - pairs:
      app.kubernetes.io/part-of: legacymark
      managed-by: kustomize
    includeSelectors: false
