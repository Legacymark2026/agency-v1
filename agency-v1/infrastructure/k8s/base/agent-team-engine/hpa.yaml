apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-team-engine-hpa
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-team-engine }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
