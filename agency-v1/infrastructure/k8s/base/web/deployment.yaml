apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web, tier: frontend, priority: tier-a }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: frontend }
    spec:
      priorityClassName: production-high-priority
      containers:
        - name: web
          image: docker.io/legacymark2026/web:latest
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1024Mi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: "production" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: DATABASE_READ_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: AUTH_DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: CORE_DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: MEDIA_DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: ANALYTICS_DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
            - { name: API_GATEWAY_URL, value: "http://api-gateway:8080" }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
