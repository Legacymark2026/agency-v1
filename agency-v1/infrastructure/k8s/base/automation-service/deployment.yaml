apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-service
  labels: { app: automation-service, tier: backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: automation-service }
  template:
    metadata:
      labels: { app: automation-service }
    spec:
      containers:
        - name: automation-service
          image: docker.io/legacymark2026/automation-service:latest
          ports: [{ containerPort: 4003 }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4003" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: POSTGRES_EXTERNAL_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4003 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 10
