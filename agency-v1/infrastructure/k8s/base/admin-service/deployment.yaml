apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  labels: { app: admin-service, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: admin-service }
  template:
    metadata:
      labels: { app: admin-service }
    spec:
      containers:
        - name: admin-service
          image: docker.io/legacymark2026/admin-service:latest
          ports: [{ containerPort: 4014 }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4014" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: POSTGRES_EXTERNAL_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4014 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 4014 }
            initialDelaySeconds: 5
            periodSeconds: 10
