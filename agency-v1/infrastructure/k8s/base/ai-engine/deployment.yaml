apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  labels: { app: ai-engine, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-engine }
  template:
    metadata:
      labels: { app: ai-engine }
    spec:
      containers:
        - name: ai-engine
          image: gcr.io/legacymark/ai-engine:latest
          ports: [{ containerPort: 4004 }]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "4000m", memory: "4Gi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4004" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: POSTGRES_EXTERNAL_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: 4004 }
            initialDelaySeconds: 10
            periodSeconds: 15
