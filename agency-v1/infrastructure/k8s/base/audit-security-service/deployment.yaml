apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-security-service
  labels: { app: audit-security-service, tier: backend, priority: tier-c }
spec:
  replicas: 1
  selector:
    matchLabels: { app: audit-security-service }
  template:
    metadata:
      labels: { app: audit-security-service, tier: backend }
    spec:
      priorityClassName: production-low-priority
      containers:
        - name: audit-security-service
          image: docker.io/legacymark2026/audit-security-service:latest
          ports: [{ containerPort: 4030 }]
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4030" }
            - { name: NODE_ENV, value: "production" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=192" }
            - { name: OTEL_SERVICE_NAME, value: "audit-security-service" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4030 }
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 4030 }
            initialDelaySeconds: 15
            periodSeconds: 10
