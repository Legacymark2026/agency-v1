# ══════════════════════════════════════════════════════════════════════════════
# LegacyMark — Strict mTLS Policy Manifest for Kubernetes Pod-to-Pod Traffic
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: legacymark-prod
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-internal-only
  namespace: legacymark-prod
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/legacymark-prod/sa/*"]
