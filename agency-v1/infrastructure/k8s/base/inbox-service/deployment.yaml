apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox-service
  labels: { app: inbox-service, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: inbox-service }
  template:
    metadata:
      labels: { app: inbox-service }
    spec:
      containers:
        - name: inbox-service
          image: gcr.io/legacymark/inbox-service:latest
          ports: [{ containerPort: 4005 }]
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "1Gi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4005" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: POSTGRES_EXTERNAL_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4005 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 4005 }
            initialDelaySeconds: 5
            periodSeconds: 10
