apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  labels: { app: finance-service, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: finance-service }
  template:
    metadata:
      labels: { app: finance-service }
    spec:
      containers:
        - name: finance-service
          image: gcr.io/legacymark/finance-service:latest
          ports: [{ containerPort: 4006 }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          envFrom: [{ secretRef: { name: service-secrets } }]
          env:
            - { name: PORT, value: "4006" }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: redis-credentials, key: url } } }
            - { name: POSTGRES_EXTERNAL_URL, valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
          livenessProbe:
            httpGet: { path: /health, port: 4006 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 4006 }
            initialDelaySeconds: 5
            periodSeconds: 10
