apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-critical-priority
value: 1000000
globalDefault: false
description: "Mission-critical infrastructure pods (Gateway, Auth, DB poolers). Never preempted."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-high-priority
value: 500000
globalDefault: false
description: "High-priority customer-facing services (Web, POS, Payment, CRM)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-medium-priority
value: 100000
globalDefault: false
description: "Standard business services (Inventory, Finance, Sales-Forecast, DIAN)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-low-priority
value: 10000
globalDefault: true
description: "Background processing and batch workers (Video rendering, Marketing blasts, Audit logs)."
