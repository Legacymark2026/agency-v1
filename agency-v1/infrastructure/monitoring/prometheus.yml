# Prometheus configuration for LegacyMark microservices
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["legacymark"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: api-gateway
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:8080"

  - job_name: "auth-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: auth-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4001"

  - job_name: "crm-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: crm-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4002"

  - job_name: "automation-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: automation-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4003"

  - job_name: "ai-engine"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: ai-engine
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4004"

  - job_name: "inbox-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: inbox-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4005"

  - job_name: "finance-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: ["legacymark"] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: finance-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:4006"

  - job_name: "docker-compose-services"
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "auth-service:4001"
          - "crm-service:4002"
          - "automation-service:4003"
          - "ai-engine:4004"
          - "inbox-service:4005"
          - "finance-service:4006"
          - "video-service:4007"
          - "calendar-service:4008"
          - "marketing-service:4009"
          - "integration-service:4010"
          - "document-service:4011"
          - "agent-team-engine:4012"
          - "analytics-service:4013"
          - "admin-service:4014"
          - "public-api-service:4015"
          - "notification-service:4016"
          - "hr-service:4017"
          - "project-service:4018"
          - "affiliate-service:4019"
          - "pos-service:4020"
          - "traefik:8082"

