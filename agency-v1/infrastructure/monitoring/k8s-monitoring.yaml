# ── Monitoring Stack (Prometheus + Grafana) ───────────────────────────────────
# Deploy to K8s: kubectl apply -f infrastructure/monitoring/k8s-monitoring.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: legacymark
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [legacymark]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: legacymark
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: legacymark
spec:
  type: ClusterIP
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: legacymark
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports: [{ containerPort: 3001 }]
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "legacymark2026" }
            - { name: GF_SERVER_HTTP_PORT, value: "3001" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: legacymark
spec:
  type: LoadBalancer
  selector: { app: grafana }
  ports: [{ port: 3001, targetPort: 3001 }]
