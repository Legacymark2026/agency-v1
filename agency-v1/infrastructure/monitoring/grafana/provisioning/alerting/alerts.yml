apiVersion: 1
groups:
  - orgId: 1
    name: LegacyMark Platform Alerts
    folder: Platform
    interval: 1m
    rules:
      - uid: container-down
        title: Container Down
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: absent(up{job="docker"} == 1)
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Container {{ $labels.instance }} is down"
        labels:
          severity: critical
      
      - uid: high-memory
        title: High Memory Usage
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        noDataState: OK
        execErrState: Alerting  
        for: 5m
        annotations:
          summary: "Memory usage above 85%"
        labels:
          severity: warning
      
      - uid: disk-space
        title: Disk Space Low
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: (1 - (node_filesystem_free_bytes / node_filesystem_size_bytes)) * 100 > 80
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Disk usage above 80% on {{ $labels.mountpoint }}"
        labels:
          severity: warning
