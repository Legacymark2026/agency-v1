# Nginx WAF and Rate Limiting Configuration
# Designed to sit in front of the API Gateway

# 1. Rate Limiting
# Define a rate limiting zone based on the client IP address.
# The zone 'api_limit' is 10MB in size, allowing approximately 160,000 IP addresses.
# The rate is limited to 10 requests per second per IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # 2. Standard Security Headers
    # Enable HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Content Security Policy (CSP) - Restrict resources
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;
    
    # Cross-Site Scripting (XSS) Filter (for older browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # 3. Pseudo-WAF Rules (Basic SQL Injection Prevention)
    # Block common SQL injection patterns in query strings
    if ($query_string ~* "(?i)(union.*select|insert.*into|update.*set|delete.*from|drop.*table|or.*1=1|waitfor.*delay)") {
        return 403;
    }

    # Block common SQL injection patterns in User-Agent header
    if ($http_user_agent ~* "(?i)(union.*select|insert.*into|update.*set|delete.*from|drop.*table|or.*1=1)") {
        return 403;
    }
    
    # Block directory traversal attempts
    if ($query_string ~* "(?i)(\.\./|\.\.\\)") {
        return 403;
    }

    # Main API Gateway block
    location / {
        # Apply rate limiting
        # Allow a burst of up to 20 requests, without delaying them.
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy settings (Replace 'api_gateway' with actual upstream)
        # proxy_pass http://api_gateway;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Default response for testing if no proxy_pass is set
        return 200 "WAF Edge is active.\n";
    }
    
    # Custom error pages for blocked requests
    error_page 403 /403.html;
    location = /403.html {
        return 403 "Forbidden by WAF Rules.\n";
    }
}
