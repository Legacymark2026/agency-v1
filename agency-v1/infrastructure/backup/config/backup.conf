# ══════════════════════════════════════════════════════════════════════════════
# LegacyMark — Immutable Air-Gapped Backup Configuration
# ══════════════════════════════════════════════════════════════════════════════
# Standard: ISO/IEC 27001:2022 (A.8.13, A.8.14) | ISO 22301:2019 (BCP)
# Compliance: DIAN & Código de Comercio Art. 50 (5-year WORM retention)
# ══════════════════════════════════════════════════════════════════════════════

# Database Connection
PG_CONTAINER="agency-v1-postgres-1"
PG_USER="${POSTGRES_USER:-legacymark}"
PG_DB="${POSTGRES_DB:-legacymark}"
PG_PORT="5432"

# Local Staging Directory (Ephemeral)
STAGING_DIR="/var/backups/legacymark/staging"
ARCHIVE_DIR="/var/backups/legacymark/archive"

# Vault Configuration
VAULT_CONTAINER="legacymark-vault"
VAULT_DATA_PATH="/root/agency-v1/agency-v1/infrastructure/vault/data"

# Air-Gapping & Off-Site Storage (S3 / Cloudflare R2 / Wasabi with WORM Object Lock)
S3_ENABLED="${BACKUP_S3_ENABLED:-false}"
S3_BUCKET="${BACKUP_S3_BUCKET:-legacymark-immutable-backups}"
S3_ENDPOINT="${BACKUP_S3_ENDPOINT:-https://s3.us-east-1.amazonaws.com}"
S3_OBJECT_LOCK_MODE="COMPLIANCE" # COMPLIANCE: Nobody (not even root) can delete until retention expires
S3_RETENTION_DAYS="90"           # 90-day immutable hold for weekly, 1825 for yearly

# Asymmetric Encryption (OpenSSL RSA-4096 / GPG)
# Production ONLY holds PUBLIC key. Private key is held OFFLINE (Air-Gapped Cold Storage).
PUBLIC_KEY_PATH="/var/backups/legacymark/keys/backup_public_key.pem"

# Notifications
WEBHOOK_URL="${BACKUP_ALERT_WEBHOOK_URL:-}"
