name: 🚀 Enterprise CI/CD GitOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: 🏗️ Build, Audit & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

  docker-build-push:
    name: 🐳 Docker Build & Push Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [crm-service, notification-service, api-gateway, auth-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub / Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            legacymark/${{ matrix.service }}:latest
            legacymark/${{ matrix.service }}:${{ github.sha }}

  gitops-deploy:
    name: 🐙 Trigger ArgoCD GitOps Deployment
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Manifests Repo
        uses: actions/checkout@v4

      - name: Update Image Tag in Kubernetes Manifests
        run: |
          sed -i "s|image: legacymark/crm-service:.*|image: legacymark/crm-service:${{ github.sha }}|g" deploy/k8s/crm-service-mesh.yaml
          sed -i "s|image: legacymark/notification-service:.*|image: legacymark/notification-service:${{ github.sha }}|g" deploy/k8s/notification-service-mesh.yaml

      - name: Commit and Push Manifest Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/*.yaml
          git commit -m "chore(gitops): update image tags to commit ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main
