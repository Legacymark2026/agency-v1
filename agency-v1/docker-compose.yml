    ports: ["4007:4007"]
    environment:
      <<: *common-env
      PORT: "4007"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Calendar Service ──────────────────────────────────────────────────────
