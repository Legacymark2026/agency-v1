# ══════════════════════════════════════════════════════════════════════════════
# LegacyMark — Production Docker Compose Stack
# ══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d                    # Core services only
#   docker compose --profile all up -d      # All services
#   docker compose --profile monitoring up -d  # With monitoring
#
# Services: 16 microservices + PostgreSQL + Redis + Next.js Web App + Traefik Gateway
#

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-microservice-base: &microservice-base
  restart: unless-stopped
  logging: *default-logging
  networks:
    - backend-net
    - database-net
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: legacymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      POSTGRES_DB: legacymark
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacymark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_USER: legacymark
      DB_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "legacymark"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - backend-net
      - database-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  # ── Autoheal (Contenedor de Autorecuperación) ──────────────────────────────
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Postgres Backup (Copias de Seguridad Diarias) ──────────────────────────
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c '
      while true; do
        echo "Starting daily pg_dump for legacymark..."
        mkdir -p /backups
        pg_dump -h postgres -U legacymark -F c -b -v -f "/backups/backup_$$(date +%Y%m%d_%H%M%S).dump" legacymark
        # Mantener solo los últimos 7 días
        find /backups -name "backup_*" -mtime +7 -delete
        echo "Backup complete. Next backup in 24 hours."
        sleep 86400
      done
      '
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - database-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Traefik API Gateway ────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: agency-v1-traefik
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@legacymark.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "8081:80"
      - "8443:443"
      - "127.0.0.1:8082:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    depends_on:
      redis: { condition: service_healthy }
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Next.js Web App ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_analytics?connection_limit=5&pgbouncer=true
      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:8080
      VIDEO_SERVICE_URL: http://video-service:4007
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-video-service-secret-change-in-production}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["all"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.routers.web.priority=1"
    networks:
      - frontend-net
      - backend-net
      - database-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      CRM_SERVICE_URL: http://crm-service:4002
      AUTOMATION_SERVICE_URL: http://automation-service:4003
      AI_SERVICE_URL: http://ai-engine:4004
      INBOX_SERVICE_URL: http://inbox-service:4005
      FINANCE_SERVICE_URL: http://finance-service:4006
      VIDEO_SERVICE_URL: http://video-service:4007
      CALENDAR_SERVICE_URL: http://calendar-service:4008
      MARKETING_SERVICE_URL: http://marketing-service:4009
      INTEGRATION_SERVICE_URL: http://integration-service:4010
      DOCUMENT_SERVICE_URL: http://document-service:4011
      AGENT_TEAM_ENGINE_URL: http://agent-team-engine:4012
      ANALYTICS_SERVICE_URL: http://analytics-service:4013
      ADMIN_SERVICE_URL: http://admin-service:4014
      PUBLIC_API_SERVICE_URL: http://public-api-service:4015
      NOTIFICATION_SERVICE_URL: http://notification-service:4016
      HR_SERVICE_URL: http://hr-service:4017
      PROJECT_SERVICE_URL: http://project-service:4018
      AFFILIATE_SERVICE_URL: http://affiliate-service:4019
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      crm-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8080"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: "4001"
      REDIS_URL: redis://redis:6379
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_analytics?connection_limit=5&pgbouncer=true
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=4001"

  # ── Goldneez Rewards Service ──────────────────────────────────────────────
  goldneez-rewards-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/goldneez-rewards-service/Dockerfile
    environment:
      PORT: "4020"
      GOLDNEEZ_DB_URL: postgresql://legacyuser:g%2Fd1b0VLZJQdTaoRdThivfuzqyT3%2BouU@pgbouncer:6432/legacymark?schema=goldneez&search_path=goldneez,public&connection_limit=5&pgbouncer=true
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4020/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.goldneez-rewards.rule=PathPrefix(`/api/goldneez-rewards`)"
      - "traefik.http.routers.goldneez-rewards.entrypoints=web"
      - "traefik.http.services.goldneez-rewards.loadbalancer.server.port=4020"

  # ── CRM Service ──────────────────────────────────────────────────────────
  crm-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/crm-service/Dockerfile
    environment: &common-env
      PORT: "4002"
      REDIS_URL: redis://redis:6379
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_analytics?connection_limit=5&pgbouncer=true
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=PathPrefix(`/api/leads`) || PathPrefix(`/api/deals`) || PathPrefix(`/api/crm`)"
      - "traefik.http.routers.crm.entrypoints=web"
      - "traefik.http.services.crm.loadbalancer.server.port=4002"

  # ── Automation Service ────────────────────────────────────────────────────
  automation-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/automation-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4003"
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.automation.rule=PathPrefix(`/api/workflows`) || PathPrefix(`/api/automation`) || PathPrefix(`/api/cron/run-automation`) || PathPrefix(`/api/cron/social-publisher`) || PathPrefix(`/api/cron/process-sequences`)"
      - "traefik.http.routers.automation.entrypoints=web"
      - "traefik.http.services.automation.loadbalancer.server.port=4003"

  # ── AI Engine ─────────────────────────────────────────────────────────────
  ai-engine:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    environment:
      <<: *common-env
      PORT: "4004"
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4004/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4G }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/agents`) || PathPrefix(`/api/ai`) || PathPrefix(`/api/knowledge-bases`)"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=4004"

  # ── Inbox Service ─────────────────────────────────────────────────────────
  inbox-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/inbox-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4005"
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4005/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inbox.rule=PathPrefix(`/api/inbox`) || PathPrefix(`/api/webhooks/whatsapp`) || PathPrefix(`/api/webhooks/meta`) || PathPrefix(`/api/webhooks/channels`) || PathPrefix(`/api/cron/email-worker`)"
      - "traefik.http.routers.inbox.entrypoints=web"
      - "traefik.http.services.inbox.loadbalancer.server.port=4005"

  # ── Finance Service ───────────────────────────────────────────────────────
  finance-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/finance-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4006"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4006/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=PathPrefix(`/api/invoices`) || PathPrefix(`/api/payroll`) || PathPrefix(`/api/expenses`) || PathPrefix(`/api/webhooks/stripe`) || PathPrefix(`/api/webhooks/paypal`) || PathPrefix(`/api/cron/subscriptions`)"
      - "traefik.http.routers.finance.entrypoints=web"
      - "traefik.http.services.finance.loadbalancer.server.port=4006"

  # ── Video Service ─────────────────────────────────────────────────────────
  video-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/video-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4007"
      REDIS_URL: redis://redis-queue:6379
      NEXT_APP_URL: http://web:3000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-video-service-secret-change-in-production}
      RENDER_OUTPUT_DIR: /app/renders
    volumes:
      - render-data:/app/renders
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4007/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.video.rule=PathPrefix(`/api/video`)"
      - "traefik.http.routers.video.entrypoints=web"
      - "traefik.http.services.video.loadbalancer.server.port=4007"

  # ── Calendar Service ──────────────────────────────────────────────────────
  calendar-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/calendar-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4008"
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4008/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calendar.rule=PathPrefix(`/api/calendar`) || PathPrefix(`/api/scheduling`)"
      - "traefik.http.routers.calendar.entrypoints=web"
      - "traefik.http.services.calendar.loadbalancer.server.port=4008"

  # ── Marketing Service ─────────────────────────────────────────────────────
  marketing-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/marketing-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "4009"
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4009/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
