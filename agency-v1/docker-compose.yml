# ══════════════════════════════════════════════════════════════════════════════
# LegacyMark — Production Docker Compose Stack
# ══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d                    # Core services only
#   docker compose --profile all up -d      # All services
#   docker compose --profile monitoring up -d  # With monitoring
#
# Services: 16 microservices + PostgreSQL + Redis + Next.js Web App + Traefik Gateway
#

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-microservice-base: &microservice-base
  restart: unless-stopped
  logging: *default-logging
  networks:
    - backend-net
    - database-net
  volumes:
    - ./certs:/certs:ro
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 384M

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/db/server.crt", "-c", "ssl_key_file=/certs/db/server.key", "-c", "ssl_ca_file=/certs/db/ca.crt"]
    environment:
      POSTGRES_USER: legacymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      POSTGRES_DB: legacymark
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - ./certs/db:/certs/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacymark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  postgres-replica:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: legacymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      PGDATA: /var/lib/postgresql/data/replica
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./certs/db:/certs/db:ro
    entrypoint: |
      sh -c '
      if [ ! -s "$$PGDATA/PG_VERSION" ]; then
        echo "Initializing replica database with pg_basebackup..."
        mkdir -p "$$PGDATA"
        until pg_basebackup -h postgres -U legacymark -D "$$PGDATA" -Fp -Xs -P -R; do
          echo "Waiting for primary postgres to be ready for backup..."
          sleep 2
        done
      fi
      exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_stat_statements -c ssl=on -c ssl_cert_file=/certs/db/server.crt -c ssl_key_file=/certs/db/server.key -c ssl_ca_file=/certs/db/ca.crt
      '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacymark"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - database-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6432:6432"
    environment:
      DB_USER: legacymark
      DB_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      CLIENT_TLS_SSLMODE: "require"
      CLIENT_TLS_CA_FILE: "/certs/db/ca.crt"
      CLIENT_TLS_CERT_FILE: "/certs/db/pgbouncer.crt"
      CLIENT_TLS_KEY_FILE: "/certs/db/pgbouncer.key"
      SERVER_TLS_SSLMODE: "require"
      SERVER_TLS_CA_FILE: "/certs/db/ca.crt"
      SERVER_LOGIN_RETRY: 2
    volumes:
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./certs/db:/certs/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "legacymark"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - backend-net
      - database-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6433:6433"
    environment:
      DB_USER: legacymark
      DB_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      DB_HOST: postgres-replica
      DB_PORT: 5432
      LISTEN_PORT: 6433
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      CLIENT_TLS_SSLMODE: "require"
      CLIENT_TLS_CA_FILE: "/certs/db/ca.crt"
      CLIENT_TLS_CERT_FILE: "/certs/db/pgbouncer.crt"
      CLIENT_TLS_KEY_FILE: "/certs/db/pgbouncer.key"
      SERVER_TLS_SSLMODE: "require"
      SERVER_TLS_CA_FILE: "/certs/db/ca.crt"
      SERVER_LOGIN_RETRY: 2
    volumes:
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./certs/db:/certs/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6433", "-U", "legacymark"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-replica: { condition: service_healthy }
    networks:
      - backend-net
      - database-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --protected-mode no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --protected-mode no
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  # ── Autoheal (Contenedor de Autorecuperación) ──────────────────────────────
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: disabled
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Postgres Backup (Copias de Seguridad Diarias) ──────────────────────────
  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-dev-backup-key-change-me}
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c '
      apk add --no-cache openssl
      while true; do
        echo "Starting daily encrypted pg_dump for legacymark..."
        mkdir -p /backups
        pg_dump -h postgres -U legacymark -F c -b legacymark | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY -out "/backups/backup_$$(date +%Y%m%d_%H%M%S).dump.enc"
        # Mantener solo los últimos 7 días
        find /backups -name "backup_*" -mtime +7 -delete
        echo "Encrypted backup complete. Next backup in 24 hours."
        sleep 86400
      done
      '
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - database-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── API Gateway (Traefik) ──────────────────────────────────────────────────
  traefik:
    image: traefik:latest
    container_name: agency-v1-traefik
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=agency-backend-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web.http.middlewares=security-headers@file"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.insecure=true"
      - "--entrypoints.websecure.http3"
      - "--entrypoints.websecure.http.middlewares=security-headers@file"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@legacymark.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--experimental.plugins.coraza.modulename=github.com/jcchavezs/coraza-http-wasm-traefik"
      - "--experimental.plugins.coraza.version=v0.3.0"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=DEBUG"
      - "--accesslog=true"
    ports:
      - "8081:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
      - "./infrastructure/traefik:/etc/traefik/dynamic:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
    depends_on:
      redis: { condition: service_healthy }
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Next.js Web App ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_core?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true&sslmode=require
      AUTH_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_auth?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      CORE_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_core?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true&sslmode=require
      MEDIA_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_media?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_analytics?connection_limit=5&pgbouncer=true&sslmode=require
      ANALYTICS_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_analytics?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:8080
      VIDEO_SERVICE_URL: http://video-service:4007
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-video-service-secret-change-in-production}
      NODE_OPTIONS: "--max-old-space-size=1024"
      NODE_EXTRA_CA_CERTS: /certs/db/ca.crt
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    # profiles: removed — web must start with the default docker compose up -d
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`legacymarksas.com`) || Host(`www.legacymarksas.com`) || PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.routers.web.priority=1"
    networks:
      - frontend-net
      - backend-net
      - database-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8083:8080"
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      AUTH_SERVICE_URL: http://auth-service:4001
      CRM_SERVICE_URL: http://crm-service:4002
      AUTOMATION_SERVICE_URL: http://automation-service:4003
      AI_SERVICE_URL: http://ai-engine:4004
      INBOX_SERVICE_URL: http://inbox-service:4005
      FINANCE_SERVICE_URL: http://finance-service:4006
      VIDEO_SERVICE_URL: http://video-service:4007
      CALENDAR_SERVICE_URL: http://calendar-service:4008
      MARKETING_SERVICE_URL: http://marketing-service:4009
      INTEGRATION_SERVICE_URL: http://integration-service:4010
      DOCUMENT_SERVICE_URL: http://document-service:4011
      AGENT_TEAM_ENGINE_URL: http://agent-team-engine:4012
      ANALYTICS_SERVICE_URL: http://analytics-service:4013
      ADMIN_SERVICE_URL: http://admin-service:4014
      PUBLIC_API_SERVICE_URL: http://public-api-service:4015
      NOTIFICATION_SERVICE_URL: http://notification-service:4016
      HR_SERVICE_URL: http://hr-service:4017
      PROJECT_SERVICE_URL: http://project-service:4018
      AFFILIATE_SERVICE_URL: http://affiliate-service:4019
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      crm-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=PathPrefix(`/graphql`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8080"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: "4001"
      GRPC_PORT: "50051"
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true&sslmode=require
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true&sslmode=require
      DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_auth?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_auth?connection_limit=5&pgbouncer=true&sslmode=require
      AUTH_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_auth?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      CORE_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_core?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_media?connection_limit=5&pgbouncer=true&sslmode=require
      MEDIA_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_media?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_analytics?connection_limit=5&pgbouncer=true&sslmode=require
      ANALYTICS_DATABASE_READ_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer-replica:6433/legacymark_analytics?connection_limit=5&pgbouncer=true&statement_timeout=10000&sslmode=require
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      NODE_EXTRA_CA_CERTS: /certs/db/ca.crt
    volumes:
      - ./certs:/certs:ro
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=4001"

  # ── Goldneez Rewards Service ──────────────────────────────────────────────
  goldneez-rewards-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/goldneez-rewards-service/Dockerfile
    environment:
      PORT: "4020"
      GOLDNEEZ_DB_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      NODE_EXTRA_CA_CERTS: /certs/db/ca.crt
    depends_on:
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4020/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.goldneez-rewards.rule=PathPrefix(`/api/goldneez-rewards`)"
      - "traefik.http.routers.goldneez-rewards.entrypoints=web"
      - "traefik.http.services.goldneez-rewards.loadbalancer.server.port=4020"

  # ── CRM Service ──────────────────────────────────────────────────────────
  crm-service:
    <<: *microservice-base
    build:
      context: .
      dockerfile: services/crm-service/Dockerfile
    environment: &common-env
      PORT: "4002"
      GRPC_PORT: "50052"
      AUTH_GRPC_URL: auth-service:50051
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: crm-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@pgbouncer:6432/legacymark_core?connection_limit=5&pgbouncer=true&sslmode=require
