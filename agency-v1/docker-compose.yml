  # ── Observability & Monitoring ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    volumes:
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3002:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - grafanadata:/var/lib/grafana
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  pgdata:
  redisdata:
  redisqueuedata:
  render-data:
  lokidata:
  grafanadata:
  letsencrypt:

networks:
  frontend-net:
    name: agency-frontend-net
  backend-net:
    name: agency-backend-net
  database-net:
    name: agency-database-net
