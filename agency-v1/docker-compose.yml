      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4017/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr.rule=PathPrefix(`/api/employees`) || PathPrefix(`/api/hr`) || PathPrefix(`/api/time-tracking`) || PathPrefix(`/api/payroll-hr`)"
      - "traefik.http.routers.hr.entrypoints=web"
      - "traefik.http.services.hr.loadbalancer.server.port=4017"

  # ── Project Service ───────────────────────────────────────────────────────
  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "4018"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4018/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project.rule=PathPrefix(`/api/projects`) || PathPrefix(`/api/kanban`) || PathPrefix(`/api/tasks`)"
      - "traefik.http.routers.project.entrypoints=web"
      - "traefik.http.services.project.loadbalancer.server.port=4018"

  # ── Affiliate Service ─────────────────────────────────────────────────────
  affiliate-service:
    build:
      context: .
      dockerfile: services/affiliate-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "4019"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4019/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.affiliate.rule=PathPrefix(`/r`) || PathPrefix(`/api/affiliates`)"
      - "traefik.http.routers.affiliate.entrypoints=web"
      - "traefik.http.services.affiliate.loadbalancer.server.port=4019"


  # ── Observability & Monitoring ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - grafanadata:/var/lib/grafana
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]

volumes:
  pgdata:
  redisdata:
  redisqueuedata:
  render-data:
  lokidata:
  grafanadata:
