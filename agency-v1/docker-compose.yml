      dockerfile: services/finance-service/Dockerfile
    ports: ["4006:4006"]
    environment:
      <<: *common-env
      PORT: "4006"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Video Service ─────────────────────────────────────────────────────────
