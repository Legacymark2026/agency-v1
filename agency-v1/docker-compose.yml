  # ── Observability & Monitoring ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    volumes:
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3002:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafanadata:/var/lib/grafana
    depends_on:
      loki: { condition: service_started }
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEMORY_MAX_TRACES: "10000"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles: ["monitoring"]
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr redpanda:8082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "8082:8082"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    networks:
      - backend-net
    profiles: ["all"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  pgdata:
  pgdata-replica:
  redisdata:
  redisqueuedata:
  render-data:
  lokidata:
  grafanadata:
  letsencrypt:
  redpandadata:

networks:
  frontend-net:
    name: agency-frontend-net
  backend-net:
    name: agency-backend-net
  database-net:
    name: agency-database-net
