# ══════════════════════════════════════════════════════════════════════════════
# LegacyMark — Production Docker Compose Stack
# ══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d                    # Core services only
#   docker compose --profile all up -d      # All services
#   docker compose --profile monitoring up -d  # With monitoring
#
# Services: 16 microservices + PostgreSQL + Redis + Next.js Web App

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: legacymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacymark_dev}
      POSTGRES_DB: legacymark
    # ports: ["5433:5432"] # Commented out to avoid host port conflicts and enhance security
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacymark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports: ["6380:6379"] # Commented out to avoid host port conflicts and enhance security
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  # ── Next.js Web App ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_core
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_auth
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_core
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_media
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_analytics
      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:8080
      VIDEO_SERVICE_URL: http://video-service:4007
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-video-service-secret-change-in-production}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api-gateway: { condition: service_healthy }
    profiles: ["all"]

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    ports: ["8081:8080"]
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      CRM_SERVICE_URL: http://crm-service:4002
      AUTOMATION_SERVICE_URL: http://automation-service:4003
      AI_SERVICE_URL: http://ai-engine:4004
      INBOX_SERVICE_URL: http://inbox-service:4005
      FINANCE_SERVICE_URL: http://finance-service:4006
      VIDEO_SERVICE_URL: http://video-service:4007
      CALENDAR_SERVICE_URL: http://calendar-service:4008
      MARKETING_SERVICE_URL: http://marketing-service:4009
      INTEGRATION_SERVICE_URL: http://integration-service:4010
      DOCUMENT_SERVICE_URL: http://document-service:4011
      AGENT_TEAM_ENGINE_URL: http://agent-team-engine:4012
      ANALYTICS_SERVICE_URL: http://analytics-service:4013
      ADMIN_SERVICE_URL: http://admin-service:4014
      PUBLIC_API_SERVICE_URL: http://public-api-service:4015
      NOTIFICATION_SERVICE_URL: http://notification-service:4016
      HR_SERVICE_URL: http://hr-service:4017
      PROJECT_SERVICE_URL: http://project-service:4018
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      crm-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    ports: ["4001:4001"]
    environment:
      PORT: "4001"
      REDIS_URL: redis://redis:6379
      POSTGRES_EXTERNAL_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_auth
      DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_auth
      AUTH_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_auth
      CORE_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_core
      MEDIA_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_media
      ANALYTICS_DATABASE_URL: postgresql://legacymark:${POSTGRES_PASSWORD:-legacymark_dev}@postgres:5432/legacymark_analytics
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  # ── CRM Service ──────────────────────────────────────────────────────────
  crm-service:
