syntax = "proto3";

package crm;

message LeadItem {
  string id = 1;
  string company_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string status = 6;
  double score = 7;
  string created_at = 8;
}

message GetLeadsRequest {
  string company_id = 1;
  string status = 2;
}

message GetLeadsResponse {
  bool success = 1;
  repeated LeadItem leads = 2;
}

message CreateLeadRequest {
  string company_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string source = 5;
}

message LeadResponse {
  bool success = 1;
  LeadItem lead = 2;
  string error = 3;
}

service CRMGRPCService {
  rpc GetLeads (GetLeadsRequest) returns (GetLeadsResponse);
  rpc CreateLead (CreateLeadRequest) returns (LeadResponse);
}
