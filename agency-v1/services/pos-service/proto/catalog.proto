syntax = "proto3";

package catalog;

// Catalog Item Entity
message CatalogItem {
  string id = 1;
  string company_id = 2;
  string sku = 3;
  string barcode = 4;
  string title = 5;
  string description = 6;
  string category = 7;
  double unit_price = 8;
  double cost_price = 9;
  double wholesale_price = 10;
  double tax_rate = 11;
  int32 stock = 12;
  bool is_active = 13;
  string image_url = 14;
  string created_at = 15;
  string updated_at = 16;
}

// Request and Response Messages
message GetProductsRequest {
  string company_id = 1;
  string category = 2;
  string search = 3;
}

message GetProductsResponse {
  bool success = 1;
  string company_id = 2;
  repeated CatalogItem products = 3;
}

message GetProductRequest {
  string id_or_sku = 1;
}

message ProductResponse {
  bool success = 1;
  CatalogItem product = 2;
  string error = 3;
}

message CreateProductRequest {
  string company_id = 1;
  string sku = 2;
  string barcode = 3;
  string title = 4;
  string description = 5;
  string category = 6;
  double unit_price = 7;
  double cost_price = 8;
  double wholesale_price = 9;
  double tax_rate = 10;
  int32 stock = 11;
  bool is_active = 12;
  string image_url = 13;
}

message UpdateProductRequest {
  string id = 1;
  string title = 2;
  double unit_price = 3;
  double cost_price = 4;
  double wholesale_price = 5;
  int32 stock = 6;
  bool is_active = 7;
}

message AdjustStockRequest {
  string product_id = 1;
  int32 delta_qty = 2;
  string reason = 3;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {
  bool success = 1;
  string message = 2;
}

// gRPC Catalog Service Contract
service CatalogGRPCService {
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
  rpc GetProductById (GetProductRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc AdjustStock (AdjustStockRequest) returns (ProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
}
