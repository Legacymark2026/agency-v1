syntax = "proto3";

package auth;

message UserItem {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  bool is_active = 5;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  UserItem user = 2;
  string error = 3;
}

service AuthGRPCService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}
