# Build & Deploy a single microservice to GKE
name: Deploy Service

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'

env:
  GCP_PROJECT: legacymark
  GKE_CLUSTER: legacymark-cluster
  GKE_ZONE: us-central1-a
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: legacymark

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: ['services/auth-service/**', 'packages/**']
            crm-service: ['services/crm-service/**', 'packages/**']
            automation-service: ['services/automation-service/**', 'packages/**']
            ai-engine: ['services/ai-engine/**', 'packages/**']
            inbox-service: ['services/inbox-service/**', 'packages/**']
            finance-service: ['agency-v1/services/finance-service/**', 'agency-v1/packages/**']
            api-gateway: ['agency-v1/services/api-gateway/**']
            video-service: ['agency-v1/services/video-service/**']
            calendar-service: ['agency-v1/services/calendar-service/**']
            marketing-service: ['agency-v1/services/marketing-service/**']
            integration-service: ['agency-v1/services/integration-service/**']
            document-service: ['agency-v1/services/document-service/**']
            agent-team-engine: ['agency-v1/services/agent-team-engine/**']
            analytics-service: ['agency-v1/services/analytics-service/**']
            admin-service: ['agency-v1/services/admin-service/**']
            public-api-service: ['agency-v1/services/public-api-service/**']

  build-deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        service:
          - auth-service
          - crm-service
          - automation-service
          - ai-engine
          - inbox-service
          - finance-service
          - api-gateway
          - video-service
          - calendar-service
          - marketing-service
          - integration-service
          - document-service
          - agent-team-engine
          - analytics-service
          - admin-service
          - public-api-service
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          IMAGE=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE -f agency-v1/services/${{ matrix.service }}/Dockerfile agency-v1
          docker push $IMAGE

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
        run: |
          IMAGE=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          kubectl set image deployment/${{ matrix.service }} ${{ matrix.service }}=$IMAGE -n legacymark
          kubectl rollout status deployment/${{ matrix.service }} -n legacymark --timeout=300s
