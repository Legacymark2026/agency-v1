name: Publish Microservices to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agency-v1/services/**'
      - 'agency-v1/packages/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: ['agency-v1/services/auth-service/**', 'agency-v1/packages/**']
            crm-service: ['agency-v1/services/crm-service/**', 'agency-v1/packages/**']
            automation-service: ['agency-v1/services/automation-service/**', 'agency-v1/packages/**']
            ai-engine: ['agency-v1/services/ai-engine/**', 'agency-v1/packages/**']
            inbox-service: ['agency-v1/services/inbox-service/**', 'agency-v1/packages/**']
            finance-service: ['agency-v1/services/finance-service/**', 'agency-v1/packages/**']
            api-gateway: ['agency-v1/services/api-gateway/**', 'agency-v1/packages/**']
            video-service: ['agency-v1/services/video-service/**', 'agency-v1/packages/**']
            calendar-service: ['agency-v1/services/calendar-service/**', 'agency-v1/packages/**']
            marketing-service: ['agency-v1/services/marketing-service/**', 'agency-v1/packages/**']
            integration-service: ['agency-v1/services/integration-service/**', 'agency-v1/packages/**']
            document-service: ['agency-v1/services/document-service/**', 'agency-v1/packages/**']
            agent-team-engine: ['agency-v1/services/agent-team-engine/**', 'agency-v1/packages/**']
            analytics-service: ['agency-v1/services/analytics-service/**', 'agency-v1/packages/**']
            admin-service: ['agency-v1/services/admin-service/**', 'agency-v1/packages/**']
            public-api-service: ['agency-v1/services/public-api-service/**', 'agency-v1/packages/**']

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - crm-service
          - automation-service
          - ai-engine
          - inbox-service
          - finance-service
          - api-gateway
          - video-service
          - calendar-service
          - marketing-service
          - integration-service
          - document-service
          - agent-team-engine
          - analytics-service
          - admin-service
          - public-api-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: legacymark/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agency-v1
          file: agency-v1/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=legacymark/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=legacymark/${{ matrix.service }}:buildcache,mode=max
