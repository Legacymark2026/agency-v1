# Configuración Dinámica de Dominio para Servidor Web (Nginx)
# Archivo para /etc/nginx/sites-available/neogestion-web o /etc/nginx/conf.d/neogestion.conf

server {
    listen 80;
    listen [::]:80;
    # Acepta el dominio con y sin www, y también la IP del servidor mientras se propaga el DNS
    server_name neogestion.software www.neogestion.software _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
