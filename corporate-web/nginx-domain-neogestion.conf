# Configuración Dinámica de Dominio para Servidor Web (Nginx)
# Archivo para /etc/nginx/sites-available/neogestion-web o /etc/nginx/conf.d/neogestion.conf

server {
    listen 80;
    listen [::]:80;
    # Acepta el dominio con y sin www, y también la IP del servidor mientras se propaga el DNS
    server_name neogestion.software www.neogestion.software _;

    # Redirección automática de HTTP a HTTPS una vez activado Certbot / SSL:
    # return 301 https://neogestion.software;

    # O si el certificado ya está activo:
    location / {
        proxy_pass http://127.0.0.1:3000; # o el puerto configurado en PM2 para neogestion-web
        proxy_http_version 1.1;
        proxy_set_header Upgrade ;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_cache_bypass ;
    }
}
